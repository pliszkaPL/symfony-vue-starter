name: Full Test Suite on PR

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  full-tests:
    name: Full Test Suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: symfony_app_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, zip
          coverage: xdebug

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run backend unit tests
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/symfony_app_test?serverVersion=8.0
        run: ./vendor/bin/pest --group=unit

      - name: Run backend integration tests
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/symfony_app_test?serverVersion=8.0
        run: ./vendor/bin/pest --group=integration

      - name: Run backend acceptance tests
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/symfony_app_test?serverVersion=8.0
        run: ./vendor/bin/pest --group=acceptance

      - name: Run Behat behavior tests
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/symfony_app_test?serverVersion=8.0
        run: ./vendor/bin/behat

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Playwright e2e tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-results
          path: |
            backend/var/log/
            frontend/playwright-report/
            frontend/test-results/

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
