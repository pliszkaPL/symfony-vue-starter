name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      confirmation:
        description: 'Type "deploy" to confirm'
        required: true

permissions:
  contents: read

jobs:
  validate-confirmation:
    name: Validate Deployment Confirmation
    runs-on: ubuntu-latest
    permissions:
      contents: none
    steps:
      - name: Check confirmation
        if: ${{ github.event.inputs.confirmation != 'deploy' }}
        run: |
          echo "Error: You must type 'deploy' to confirm the deployment"
          exit 1

  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: validate-confirmation
    permissions:
      contents: read
    environment:
      name: ${{ github.event.inputs.environment }}
      url: https://${{ secrets.DOMAIN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh $SERVER_USER@$SERVER_HOST << 'EOF'
            cd $DEPLOY_PATH
            git pull origin main
            make build-prod
            make down-prod
            make up-prod
          EOF

      - name: Health check
        run: |
          sleep 10
          curl -f https://${{ secrets.DOMAIN }} || exit 1
          curl -f https://api.${{ secrets.DOMAIN }} || exit 1

      - name: Notify on success
        if: success()
        run: echo "Deployment to ${{ github.event.inputs.environment }} successful!"

      - name: Notify on failure
        if: failure()
        run: echo "Deployment to ${{ github.event.inputs.environment }} failed!"
